# Go CI on the office runner (DEV-2365). The checks and the vet/unit jobs live in
# TMS360/.github: .github/workflows/go-service-ci.yml — change them there, once.
#
# DEV-1613. backend-pkg has no goose migrations and no private module deps,
# so those checks stay off. A missing script must not fail the gate.
name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull-request runs only; every push keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: TMS360/.github/.github/workflows/go-service-ci.yml@main
    secrets: inherit
    with:
      migration-review: false
      migration-versions: false
      require-g-token: false
      # Default command skips any /tests/ tree. Here that tree is unit tests.
      unit-test-command: "go test -count=1 ./..."
      # One pre-existing file is not gofmt-clean. DEV-2409 owns that sweep.
      gofmt: false
