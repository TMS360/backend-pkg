// pkg/proto/customers/customers.proto
//
// CustomerService — server-side customer / factoring lookup used by accounting
// for tasks the Apollo Router can't fulfil (PDF render, Triumph SFTP packet,
// outbound email). NOT a replacement for the federated Customer type on
// GraphQL — frontend clients pull customer data through Apollo Federation
// (Customer @key) from this same service's GraphQL subgraph. gRPC is the
// internal channel for backend-to-backend.
syntax = "proto3";

package customers;

option go_package = "github.com/TMS360/backend-pkg/proto/customers";

service CustomerService {
  // GetCustomers resolves one or many customer ids to full Bill-To +
  // factoring details. Batched to support invoice batch PDF prints in a
  // single round trip.
  rpc GetCustomers(GetCustomersRequest) returns (GetCustomersResponse);

  // RMS facts for load's customer gates (M4, M21, M22, M23). company_id is
  // required: the server answers codes.InvalidArgument when it is empty or
  // not a UUID and never runs the read unscoped.
  rpc GetCustomerPolicyFacts(GetCustomerPolicyFactsRequest) returns (GetCustomerPolicyFactsResponse);

  // ListCustomerStatuses returns the status (ACTIVE / INACTIVE / BLOCKED) of the
  // customer cards of company_id (DEV-2727). With customer_ids empty it lists
  // every customer of the company; otherwise only those ids, and an id of
  // another company is simply absent from the answer. tms-files uses it to skip
  // inactive customers in the compliance flag and to count the customers a
  // "Block new loads" switch would block today.
  rpc ListCustomerStatuses(ListCustomerStatusesRequest) returns (ListCustomerStatusesResponse);
}

message ListCustomerStatusesRequest {
  string company_id = 1;            // tenant UUID (required)
  repeated string customer_ids = 2; // courier_customers.id; empty = all
}

message CustomerStatus {
  string id = 1;     // courier_customers.id
  string status = 2; // enums.CompanyStatus
}

message ListCustomerStatusesResponse {
  repeated CustomerStatus customers = 1;
}

message GetCustomersRequest {
  repeated string customer_ids = 1; // UUIDs
}

message GetCustomersResponse {
  repeated Customer customers = 1;
}

message Customer {
  string id = 1;
  string company_name = 2;
  string mc_number = 3;
  // Bill-To address as a single rendered line (city, state, zip joined).
  // Empty string when not configured.
  string billing_address = 4;
  // Optional factoring routing. Absent when the customer pays direct.
  optional Factoring factoring = 5;
  // USDOT number from CourierCustomer.usdot. Empty string when not set.
  string usdot = 6;
  // Billing email from CustomerBilling.billing_email — where backend-accounting
  // emails the invoice PDF for direct-pay (non-factored) customers. Empty
  // string when not configured (send is blocked, mark-sent-manually allowed).
  string billing_email = 7;
  // Payment terms in net days from CustomerBilling.terms_day (Net 30 → 30).
  // Absent when not configured — accounting then leaves the invoice's existing
  // terms / due date untouched.
  optional int32 terms_day = 8;
  // The company this customer belongs to (DEV-2025).
  //
  // GetCustomers answers with a system actor on purpose — accounting calls it
  // for PDF and SFTP work that is not tied to a user session — so the response
  // is NOT tenant-scoped and a caller that looks a customer up by id alone
  // cannot tell whether it is even its own. Carrying the owner lets the caller
  // decide; without it, "customer exists" and "customer exists in MY company"
  // are the same answer, which is how a load ends up billed to a stranger.
  //
  // Empty string only for a row saved before the field existed.
  string company_id = 9;
  // CustomerBilling.billing_type as the enums.BillingType string
  // (FACTORING_COMPANY / EMAIL / MANUAL / WEB_PORTAL / EDI) (DEV-2282).
  //
  // Absent when the customer has NO billing row yet — nobody has confirmed how
  // this broker is billed. `factoring` alone cannot say that: it is nil both for
  // a direct-pay broker and for an unreviewed one, and accounting must not send
  // an unreviewed broker to the factor or park it in the direct queue.
  optional string billing_type = 10;
  // CourierCustomer.default_high_value (DEV-2525): every new load for this
  // broker starts as high-value. Read by backend-load at create only; false
  // for a broker that was never marked.
  bool default_high_value = 11;
}

message Factoring {
  string company_name = 1;
  // Remit-To address as a single rendered line. Empty when only the company
  // name is configured.
  string remit_to = 2;
}

message GetCustomerPolicyFactsRequest {
  string company_id = 1;            // tenant UUID (required)
  repeated string customer_ids = 2; // UUIDs
}

message GetCustomerPolicyFactsResponse {
  repeated CustomerPolicyFacts customers = 1;
}

message CustomerPolicyFacts {
  string customer_id = 1;
  string status = 2;
  string customer_type = 3;
  optional string broker_group = 4;
  string driver_instructions = 5;
  repeated ActiveWarning warnings = 6; // only non-expired warnings
  optional CreditFacts credit = 7;
}

message ActiveWarning {
  string type = 1;
  string title = 2;
  optional double credit_limit = 3;
  optional string expires_at = 4; // RFC3339; unset = never expires
}

message CreditFacts {
  optional double credit_score = 1;
  optional string credit_rate = 2;
  optional string approval_status = 3;
  optional int32 days_to_pay = 4;
  optional int32 rts_invoice_count = 5;
  optional string rts_score = 6;
  optional string rts_as_of = 7; // RFC3339
}
