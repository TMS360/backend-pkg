// pkg/proto/teams/teams.proto
syntax = "proto3";

package teams;

import "google/protobuf/timestamp.proto";
import "filters/filters.proto";

option go_package = "github.com/TMS360/backend-pkg/proto/teams";

service TeamsService {
  // Get DriverCrew details by targetDate
  rpc GetDriverCrew(GetDriverCrewRequest) returns (GetDriverCrewResponse);

  rpc GetDriverCrewWithDispatchers(GetDriverCrewRequest) returns (GetDriverCrewWithDispatchersResponse);

  // Returns IDs of vehicles assigned during the requested window
  rpc GetBusyVehicles(GetBusyVehiclesRequest) returns (GetBusyVehiclesResponse);

  // Get current drivers for a list of trucks
  rpc GetCurrentDriversByTruckIds (GetCurrentDriversByTruckIdsRequest) returns (GetCurrentDriversByTruckIdsResponse);
  rpc GetCurrentDriversByTrailerIds (GetCurrentDriversByTrailerIdsRequest) returns (GetCurrentDriversByTrailerIdsResponse);

  // Get the driver's currently-active crew snapshot (truck/trailer/plan from the open DriverCrewItem).
  // Used by the driver-app documents endpoint to resolve which truck/trailer files to surface.
  rpc GetActiveCrewByDriver(GetActiveCrewByDriverRequest) returns (GetActiveCrewByDriverResponse);

  // DEV-972: availability guard read. Answers "are the crew's drivers available
  // to take a load over the supplied day(s)/time window?" by reusing the
  // DEV-971 resolved availability read (audit_days + driver_absences). The rule
  // stays with the data owner (teams); backend-load calls this from updateTrip.
  rpc IsDriverCrewAvailable(IsDriverCrewAvailableRequest) returns (IsDriverCrewAvailableResponse);

  // Cross-service filtering: returns driver crew IDs matching the filter
  rpc ResolveDriverCrewIDs(DriverCrewFilter) returns (filters.IDsResponse);

  // Cross-service filtering: returns truck IDs matching the filter
  rpc ResolveTruckIDs(TruckFilter) returns (filters.IDsResponse);

  // Cross-service filtering: returns trailer IDs matching the filter
  rpc ResolveTrailerIDs(TrailerFilter) returns (filters.IDsResponse);

  // Cross-service filtering: returns driver IDs matching the filter
  rpc ResolveDriverIDs(DriverFilter) returns (filters.IDsResponse);

  // DEV-1935: the money accounting pays dispatchers on. Returns every team-week
  // overlapping the requested period WITH its lock state, not only the closed
  // ones — accounting has to flag a pay batch whose period still contains an
  // open week, so it must see the open ones too.
  //
  // The figures are the Audit board's own: accounting reads them and never
  // recomputes a commission of its own.
  rpc GetTeamWeeksForPayroll(GetTeamWeeksForPayrollRequest) returns (GetTeamWeeksForPayrollResponse);

  // DEV-2240: who held a truck or trailer over a DATE RANGE. Every other crew
  // read on this service answers "right now" / "on this day" for one instant;
  // an asset charge (truck payment, trailer rent) is split between the drivers
  // who held the asset on each day of a period, so the caller needs the whole
  // period in one answer — polling the instant read day by day would still miss
  // an intra-day swap.
  //
  // The GraphQL query crewAssignmentsHistory serves the same rows to the office
  // UI from the same service method, so the two doors cannot disagree.
  rpc GetCrewAssignmentsHistory(GetCrewAssignmentsHistoryRequest) returns (GetCrewAssignmentsHistoryResponse);

  // DEV-2524: the saved preferences of the given drivers (what each driver wants
  // to avoid). One entry per requested driver, in request order; a driver with
  // nothing saved comes back as an empty set, never an error. Preferences are
  // hints for the caller — tms-teams never blocks anything on them.
  rpc GetDriverPreferences(GetDriverPreferencesRequest) returns (GetDriverPreferencesResponse);
}

message DriverCrewFilter {
  filters.IDFilter primary_driver_id = 1;
  filters.IDFilter truck_id = 2;
  filters.IDFilter trailer_id = 3;
  optional string search = 4;
}

message TruckFilter {
  filters.StringFilter number = 1;
  filters.StringFilter vin = 2;
  filters.StringFilter make = 3;
  filters.StringFilter model = 4;
  filters.StringFilter status = 5;
  filters.IntFilter year = 6;
  optional string search = 7;
}

message TrailerFilter {
  filters.StringFilter number = 1;
  filters.StringFilter vin = 2;
  filters.StringFilter make = 3;
  filters.StringFilter model = 4;
  filters.StringFilter status = 5;
  filters.StringFilter trailer_type = 6;
  optional string search = 7;
}

message DriverFilter {
  filters.StringFilter first_name = 1;
  filters.StringFilter last_name = 2;
  filters.StringFilter email = 3;
  filters.StringFilter phone = 4;
  filters.StringFilter status = 5;
  filters.StringFilter license_number = 6;
  optional string search = 7;
}

message GetDriverCrewRequest {
  string driver_crew_id = 1;
  string target_date = 2; // Format: YYYY-MM-DD
}

message GetDriverCrewResponse {
  DriverCrewInfo data = 1;
}

message GetDriverCrewWithDispatchersResponse {
  DriverCrewInfo data = 1;
  repeated string dispatcher_ids = 2;
}

message GetBusyVehiclesRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message GetBusyVehiclesResponse {
  repeated string truck_ids = 1;
  repeated string trailer_ids = 2;
}

message GetCurrentDriversByTruckIdsRequest {
  string target_date = 1; // Format: YYYY-MM-DD
  repeated string truck_ids = 2;
}

message GetCurrentDriversByTruckIdsResponse {
  repeated DriverCrewInfo data = 1;
}

message GetCurrentDriversByTrailerIdsRequest {
  string target_date = 1; // Format: YYYY-MM-DD
  repeated string trailer_ids = 2;
}

message GetCurrentDriversByTrailerIdsResponse {
  repeated DriverCrewInfo data = 1;
}

message DriverCrewInfo {
  string driver_crew_id = 1;
  string primary_driver_id = 2;
  string secondary_driver_id = 3;
  string truck_id = 4;
  string trailer_id = 5;
  string plan_id = 6;
  // DEV-2263: the dispatchers' standing note about this crew's driver
  // (driver_crews.planning_note, DEV-2089) — "won't run into New Jersey".
  // Empty when the crew carries no note; clearing the note empties it again.
  // A hint for the caller to show, never a rule: tms-teams does not act on it.
  string planning_note = 7;
  // driver_crews.status: ACTIVE / INACTIVE / ON_LEAVE (empty from older servers).
  string status = 8;
  // DEV-2524: each driver's own preferences (one record per driver, not per crew —
  // the two drivers of a team crew want different things). Unset from older
  // servers; an empty set when the driver saved nothing.
  DriverPreferences primary_driver_preferences = 9;
  DriverPreferences secondary_driver_preferences = 10;
}

// DEV-2524: what a driver wants to avoid. Wishes, not abilities: never a block.
message DriverPreferences {
  string driver_id = 1;
  // Number limits. Unset = no limit.
  optional int32 min_trip_miles = 2;
  optional int32 max_trip_miles = 3;
  optional int32 max_driving_hours_per_day = 4;
  optional int32 max_weight_lbs = 5;
  optional int32 max_stops = 6;
  optional int32 max_empty_miles_to_pickup = 7;
  // Yes/no wishes. false = no preference.
  bool no_hazmat = 8;
  bool no_reefer = 9;
  bool no_flatbed = 10;
  bool no_high_value = 11;
  bool no_border_crossing = 12;
  bool avoid_toll_roads = 13;
  bool avoid_interstates = 14;
  bool no_night_driving = 15;
  // 2-letter US state codes, upper case.
  repeated string avoided_states = 16;
  repeated AvoidedCity avoided_cities = 17;
  // Customer ids; a deleted customer's id simply stays in the list.
  repeated string avoided_customer_ids = 18;
  repeated AvoidedMountainArea avoided_mountain_areas = 19;
  string avoided_facilities = 20;
  string notes = 21;
}

message AvoidedCity {
  string city = 1;
  string state = 2;
}

message AvoidedMountainArea {
  string area_code = 1;
  bool winter_only = 2;
}

message GetDriverPreferencesRequest {
  repeated string driver_ids = 1;
}

message GetDriverPreferencesResponse {
  repeated DriverPreferences data = 1;
}

message TrailerInfo {
  string truck_id = 1;
}

// DEV-972: window to check a crew's drivers against.
//   - start_date == end_date + from_time/to_time set  → timed pickup, single day,
//     part-day overlap rule applies on the teams side.
//   - start_date..end_date span, from_time/to_time empty → whole-day check per day.
// Dates are YYYY-MM-DD; times are HH:MM (24h clock, time-of-day only).
message IsDriverCrewAvailableRequest {
  string driver_crew_id = 1;
  string start_date = 2;          // YYYY-MM-DD, first day to check
  string end_date = 3;            // YYYY-MM-DD, last day to check (== start_date for timed checks)
  optional string from_time = 4;  // HH:MM clock window start; empty = whole-day
  optional string to_time = 5;    // HH:MM clock window end
}

// available=false populates the remaining fields with the FIRST block found.
message IsDriverCrewAvailableResponse {
  bool available = 1;
  string unavailable_date = 2; // YYYY-MM-DD the block was found on
  string reason = 3;           // human reason: daily-status name or absence reason
  string source = 4;           // "DAILY_STATUS" | "ABSENCE"
  string driver_id = 5;        // which driver of the crew triggered the block
}

message GetActiveCrewByDriverRequest {
  string driver_id = 1;
}

// Empty crew_id means the driver has no DriverCrew yet (not an error).
// Empty truck_id/trailer_id/plan_id mean the active item has those fields unset
// (or no active item exists at all).
message GetActiveCrewByDriverResponse {
  string crew_id = 1;
  string truck_id = 2;
  string trailer_id = 3;
  string plan_id = 4;
  string secondary_driver_id = 5;
}

// GetTeamWeeksForPayrollRequest asks for every team-week that overlaps
// [from, to]. Week boundaries are the TENANT's, not the caller's: the company's
// own week cutover decides where a week starts, so accounting must not try to
// enumerate weeks itself.
message GetTeamWeeksForPayrollRequest {
  string company_id = 1;
  string from = 2; // YYYY-MM-DD, inclusive
  string to = 3;   // YYYY-MM-DD, inclusive
}

// TeamWeekPayroll is one team's one week as the Audit board reports it.
message TeamWeekPayroll {
  string team_id = 1;
  string team_name = 2;
  string week_start = 3; // YYYY-MM-DD, the tenant's week cutover

  // is_management_locked is true only when EVERY crew-week under the team is
  // frozen — that is the sign-off accounting is allowed to pay on. An open week
  // is still returned, with this false, so the caller can refuse to approve.
  bool is_management_locked = 4;
  // management_locked_at is RFC3339, empty while the week is open.
  string management_locked_at = 5;

  // commission and bonus are the week's own money.
  double commission = 6;
  double bonus = 7;
  // prior_week_adjustment_commission is money carried in from earlier closed
  // weeks. Deliberately a separate figure and NOT part of commission: the week
  // is measured on its own work (DEV-1934), and a dispatcher statement shows the
  // carry-forward as its own line.
  double prior_week_adjustment_commission = 8;
  // total_gross is the team's billed revenue for the week — context for the
  // statement, not a payable.
  double total_gross = 9;

  // dispatcher_ids are the team's dispatchers for that week. Empty means the
  // team has none, which is not an error: accounting flags the commission line
  // for a human instead of dropping it.
  repeated string dispatcher_ids = 10;

  // is_audit_finalized is the SECOND stage of the week lock (DEV-2448): the
  // week was not merely closed for editing, its audit was signed off, once and
  // for good. is_management_locked can still be lifted; this cannot.
  //
  // Dispatcher pay is approved on THIS, not on is_management_locked — a closed
  // week can be reopened under a statement that was already paid.
  bool is_audit_finalized = 11;
  // audit_finalized_at is RFC3339, empty while the audit is not confirmed.
  string audit_finalized_at = 12;
  // audit_finalized_by is the user who signed the week off, empty while open.
  string audit_finalized_by = 13;
}

message GetTeamWeeksForPayrollResponse {
  repeated TeamWeekPayroll data = 1;
}

// CrewAssetType names which column of driver_crew_items the asset id is matched
// against. UNSPECIFIED is rejected: guessing the asset kind from the id would
// silently answer for the wrong vehicle.
enum CrewAssetType {
  CREW_ASSET_TYPE_UNSPECIFIED = 0;
  CREW_ASSET_TYPE_TRUCK = 1;
  CREW_ASSET_TYPE_TRAILER = 2;
}

// GetCrewAssignmentsHistoryRequest asks "who held this asset between from and
// to". Both bounds are INCLUSIVE calendar days; the tenant is mandatory and
// arrives as company_id because this listener has no auth interceptor.
message GetCrewAssignmentsHistoryRequest {
  string company_id = 1;
  CrewAssetType asset_type = 2;
  string asset_id = 3;
  string from = 4; // YYYY-MM-DD, inclusive
  string to = 5;   // YYYY-MM-DD, inclusive
}

// CrewAssignmentHistoryRow is one crew's unbroken hold of the asset, already
// CLIPPED to the requested window: a crew that still holds it (valid_to is null)
// ends at the request's `to`, and one that started earlier begins at `from`.
// A day nobody held the asset produces no row at all — absence is the answer,
// and the caller posts those days where its own rules say (e.g. to the company).
message CrewAssignmentHistoryRow {
  string crew_id = 1;
  string primary_driver_id = 2;
  string secondary_driver_id = 3; // empty when the crew ran solo
  string from = 4; // YYYY-MM-DD, inclusive, first day this crew held the asset
  string to = 5;   // YYYY-MM-DD, inclusive, last day this crew held the asset
}

message GetCrewAssignmentsHistoryResponse {
  repeated CrewAssignmentHistoryRow data = 1;
}
