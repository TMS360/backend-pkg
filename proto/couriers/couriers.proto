// pkg/proto/couriers/couriers.proto
syntax = "proto3";

package couriers;

import "google/protobuf/empty.proto";
import "filters/filters.proto";

option go_package = "github.com/TMS360/backend-pkg/proto/couriers";

service CouriersService {
  rpc UpdateCache(google.protobuf.Empty) returns (UpdateCacheResponse);

  rpc GetUsersByIds(GetUsersByIdsRequest) returns (GetUsersByIdsResponse);

  // Cross-service filtering: returns user IDs matching the filter
  rpc ResolveIDs(UserFilter) returns (filters.IDsResponse);

  // Returns user_ids of all users in company with role ∉ {driver, super_admin}.
  rpc ListOfficeUsers(ListOfficeUsersRequest) returns (ListOfficeUsersResponse);

  // Returns user_ids of drivers (role = driver) in the company. By default ALL
  // of them (active + inactive) — set active_only to narrow to status = ACTIVE.
  // Consumers: backend-accounting's pay-batch "Add driver" picker
  // (availableDriversForBatch, wants all) and its fuel-coverage queue
  // (fuelDriverCoverage, wants active only).
  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse);

  // ListUserFiles returns user_files attached to a (entity_type, entity_id) pair
  // within the requesting actor's tenant. Used by the driver-app aggregator in
  // tms-loads to surface a driver's personal documents (license, medical card, etc.).
  rpc ListUserFiles(ListUserFilesRequest) returns (ListUserFilesResponse);

  // GetUsersByPermission resolves the user_ids in a tenant that should receive
  // alerts gated by a permission code, with a fallback chain (named holders →
  // tenant admins). Used by DEV-1018 (tms-files compliance reminder cron) to
  // route document-expiry reminders to the right recipients.
  rpc GetUsersByPermission(GetUsersByPermissionRequest) returns (GetUsersByPermissionResponse);

  // ListCompanyAdmins returns a tenant's admin-role accounts, ACTIVE ones first
  // and the oldest account first inside each group, so a caller that must hand
  // an ownerless resource to a human can take admins[0] deterministically.
  //
  // Unlike GetUsersByPermission this asks a plain identity question ("who runs
  // this tenant") with no permission-code tier chain, and it reports each
  // candidate's activity so the caller never hands the resource to a second dead
  // account. A tenant with no admin at all falls back to its oldest office
  // account — the sign-up owner — flagged as fallback=true.
  //
  // Consumer: backend-workspaces (DEV-1890), which passes an orphaned workspace
  // to an admin when its only OWNER is deactivated.
  rpc ListCompanyAdmins(ListCompanyAdminsRequest) returns (ListCompanyAdminsResponse);

  // GetDriverTypesAt resolves each driver's employment model AS OF a calendar
  // day, from the driver_type_periods history (DEV-1813) rather than the live
  // users.driver_ownership column.
  //
  // Money that belongs to a period must be priced by the type in force during
  // that period: a driver who moves Company -> Lease on a Friday still settles
  // that whole week as Company. Callers that only need "the type right now"
  // (a profile screen, a picker) should keep using GetUsersByIds — this RPC
  // exists for the settlement paths (DEV-1815).
  rpc GetDriverTypesAt(GetDriverTypesAtRequest) returns (GetDriverTypesAtResponse);

  // GetUsersByRoles returns the user_ids in a tenant that hold ANY of role_ids.
  //
  // Like ListCompanyAdmins this is a plain identity question ("who is in
  // Safety"), NOT an alert-routing decision: there is no permission-code tier
  // chain and no fallback, so an empty answer comes back as an empty list and
  // the CALLER decides what it means.
  //
  // Consumer: tms-files (DEV-2009), which routes one document type's expiry
  // reminders to the roles an admin picked and falls back to the
  // compliance.receive-alerts holders itself. A fallback inside this RPC would
  // hide which tier answered and make that routing untestable.
  rpc GetUsersByRoles(GetUsersByRolesRequest) returns (GetUsersByRolesResponse);
}

// ResolutionSource reports which fallback tier produced the recipient list.
// Values are fully prefixed per this repo's enum convention (and to avoid the
// generic NONE/etc. colliding in the package-level enum-value namespace).
enum ResolutionSource {
  RESOLUTION_SOURCE_UNSPECIFIED  = 0;
  RESOLUTION_SOURCE_NAMED_USERS  = 1; // users effectively holding the permission code
  RESOLUTION_SOURCE_ROLE_DEFAULT = 2; // reserved: tms-auth has no notification-default-role concept yet
  RESOLUTION_SOURCE_TENANT_ADMIN = 3; // fallback to the tenant's admin role
  RESOLUTION_SOURCE_NONE         = 4; // nothing resolved (anomaly — caller logs/alerts)
}

message GetUsersByPermissionRequest {
  string company_id      = 1; // tenant UUID (required)
  string permission_code = 2; // e.g. "compliance.receive-alerts" (required)
  // document_type_id is RESERVED for future per-doc-type permission granularity.
  // tms-auth RBAC is tenant-wide (not doc-type scoped), so it is currently ignored.
  optional string document_type_id = 3;
}

message GetUsersByPermissionResponse {
  repeated string user_ids = 1; // resolved recipients (UUID strings)
  ResolutionSource source  = 2; // which tier produced user_ids
}

message GetUsersByRolesRequest {
  string company_id      = 1; // tenant UUID (required)
  // Role UUIDs (required, non-empty). Built-in and tenant-custom role ids are
  // both accepted; a role id belonging to another tenant simply matches nobody,
  // because membership is read through the requested company's users.
  repeated string role_ids = 2;
}

message GetUsersByRolesResponse {
  repeated string user_ids = 1; // distinct members of any of role_ids
}

message ListCompanyAdminsRequest {
  string company_id = 1; // tenant UUID (required)
  // true → only accounts that can still sign in (status = ACTIVE, not
  // deactivated). false/absent → every admin, active ones listed first.
  optional bool active_only = 2;
}

message ListCompanyAdminsResponse {
  repeated CompanyAdmin admins = 1; // ordered: active first, oldest account first
}

message CompanyAdmin {
  string user_id = 1;
  bool active    = 2; // status = ACTIVE and never deactivated
  // true when the tenant has no admin at all and this is its oldest office
  // account instead. The caller can refuse to act on a fallback candidate.
  bool fallback  = 3;
}

message UserFilter {
  filters.StringFilter name = 1;
  filters.StringFilter email = 2;
  filters.StringFilter phone = 3;
  filters.StringFilter role = 4;
  optional string search = 5; // full-text search across name, email
}

message UpdateCacheResponse {
  bool success = 1;
}

message GetUsersByIdsRequest {
  repeated string user_ids = 1;
}

message GetUsersByIdsResponse {
  repeated UserInfo users = 1;
}

message UserInfo {
  string id = 1;
  string name = 2;
  string email = 3;
  int32 driver_ownership = 4;   // 0 = unset; 1..6 = enums.DriverOwnership
  string phone = 5;             // primary phone (User.phone); "" = unset
  string phone_second = 6;      // secondary phone (User.phone_second); "" = unset
  // true when the account can still sign in (status = ACTIVE, never
  // deactivated). Added for DEV-1890: a caller repairing resources owned by
  // dead accounts has to tell a live owner from a deactivated one, and every
  // other field here is identity, not state.
  bool active = 7;
}

message GetDriverTypesAtRequest {
  repeated string user_ids = 1;
  // Calendar day the type is asked about, "YYYY-MM-DD". A DATE, never an
  // instant: an employment model starts on a day, and shipping a timestamp
  // would make the answer depend on whose timezone parsed it.
  string date = 2;
}

message GetDriverTypesAtResponse {
  // user_id -> enums.DriverOwnership code (1..6). A driver with no period
  // covering `date` is ABSENT from the map rather than present as 0: "we do not
  // know this driver's type that day" and "the type is unset" price
  // differently, and collapsing them would silently charge someone.
  map<string, int32> driver_types = 1;
}

message ListOfficeUsersRequest {
  string company_id = 1;
}

message ListOfficeUsersResponse {
  repeated string user_ids = 1;
}

message ListDriversRequest {
  string company_id = 1;
  // true  → only status = ACTIVE (excludes inactive AND banned).
  // false/absent → historical behaviour: every driver regardless of status.
  // Kept optional so existing callers (pay-batch picker) are unaffected, and so
  // a newer client talking to an older server degrades to "all drivers" rather
  // than erroring.
  optional bool active_only = 2;
}

message ListDriversResponse {
  repeated string user_ids = 1;
}

message ListUserFilesRequest {
  // entity_type ∈ {"DRIVER", "DISPATCHER"}
  string entity_type = 1;
  string entity_id = 2;
}

message UserFile {
  string id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string file_id = 4;
  string document_type = 5;
  string document_type_id = 6;
  string company_id = 7;
  string uploaded_by = 8;
  string notes = 9;
  // RFC3339 timestamps
  string created_at = 10;
  string updated_at = 11;
}

message ListUserFilesResponse {
  repeated UserFile files = 1;
}