# DEV-1613. backend-pkg is a public repo, so it cannot call the private
# reusable workflow in TMS360/.github. The unit job is inlined.
# No private modules, so there is no G_TOKEN step.
# No goose scripts, so there is no migration check.
# gofmt stays with DEV-2409 (one file is already unformatted).
name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: vet + unit tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ vars.CI_RUNNER == '' }}

      - name: go vet
        run: go vet ./...

      - name: go test (unit)
        run: go test -count=1 ./...
