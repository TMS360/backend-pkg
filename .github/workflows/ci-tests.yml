# Fleet unit CI — same gate as backend-load's unit job (DEV-1434).
# No integration/postgres here: land the gate green first; add tests/ later per-repo.
# G_TOKEN is optional: github.com/TMS360/backend-pkg is a public repository, so the
# default module proxy resolves it with no credentials.
#
# Context: reports/CI_AUDIT_2026-07-28.md · reports/CI_HEALTH_2026-08-09.md

name: CI tests

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: vet + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # backend-pkg is a public repository, so the default proxy resolves it with no
      # credentials — which is why this step does not fail when G_TOKEN is absent.
      # If it is ever made private, set the secret and this step starts
      # authenticating again without needing an edit here.
      - name: Authenticate private modules
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}
        run: |
          if [ -z "$G_TOKEN" ]; then
            echo "G_TOKEN not set — relying on the public module proxy."
            exit 0
          fi
          go env -w GOPRIVATE='github.com/TMS360/*'
          git config --global url."https://x-access-token:${G_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: go vet
        run: go vet ./...

      # Exclude integration trees that hardcode Host: "db" / redis and need service containers.
      # -count=1 disables the result cache so green means the tests actually ran.
      - name: go test (unit)
        run: go test -count=1 $(go list ./... | grep -vE '/tests(/|$)|/test(/|$)')
