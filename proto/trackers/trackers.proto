// pkg/proto/trackers/trackers.proto
syntax = "proto3";

package trackers;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/TMS360/backend-pkg/proto/trackers";

// TrackersService provides vehicle tracking functionality
service TrackersService {
  // StreamVehicleVINs sends a stream of VINs from backend-load to samsara-tracker
  rpc StreamVehicleVINs(StreamVehicleVINsRequest) returns (stream VehicleVIN);

  // GetActiveTripStops returns pending trip stops for a truck (admin/debug only)
  rpc GetActiveTripStops(GetActiveTripStopsRequest) returns (GetActiveTripStopsResponse);

  // GetTripStops returns all stops for a given trip (used by asset-tracking
  // to build the initial route after consuming a trips/created Kafka event).
  rpc GetTripStops(GetTripStopsRequest) returns (GetTripStopsResponse);

  // ApplyRouteETAs writes planned_arrival in batch for a list of stops, called
  // by asset-tracking after the initial route build (replaces UpdateStopETA).
  rpc ApplyRouteETAs(ApplyRouteETAsRequest) returns (ApplyRouteETAsResponse);

  // GetDeadheadOrigin resolves the deadhead-origin fallback for a trip whose
  // seq=0 origin stop has no coordinates yet (Samsara asset-tracking OFF flow):
  // reports the company's Samsara setting and, when OFF, the truck's previous
  // delivered trip's final drop-off coordinates (DEV-1196).
  rpc GetDeadheadOrigin(GetDeadheadOriginRequest) returns (GetDeadheadOriginResponse);

  // RecordOdometerReadings writes odometer readings for trucks and trailers
  // through the same service method the manual GraphQL mutation uses, so the
  // no-rollback rule and the audit entry exist once (DEV-2250). One reading per
  // asset per call is the normal case; a batch answers per reading, because a
  // rejected reading is an ordinary outcome here and must not fail the others.
  rpc RecordOdometerReadings(RecordOdometerReadingsRequest) returns (RecordOdometerReadingsResponse);
}

// Request to stream vehicle VINs
message StreamVehicleVINsRequest {
  // Optional: include only active vehicles
  bool active_only = 1;
  // Optional: last sync timestamp to get only updates
  google.protobuf.Timestamp last_sync = 2;
}

// Vehicle VIN information
message VehicleVIN {
  string id = 1;           // UUID of truck or trailer
  string vin = 2;          // Vehicle Identification Number
  VehicleType type = 3;    // Type of vehicle
  string number = 4;       // Vehicle number
  google.protobuf.Timestamp updated_at = 5;
  string company_id = 6;   // Company ID for grouping vehicles
}

// Type of vehicle
enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  VEHICLE_TYPE_TRUCK = 1;
  VEHICLE_TYPE_TRAILER = 2;
}

// Location update message for Kafka
message VehicleLocationUpdate {
  string id = 1;                          // UUID of truck or trailer
  string vin = 2;                         // Vehicle Identification Number
  VehicleType type = 3;                   // Type of vehicle
  double latitude = 4;                    // Latitude coordinate
  double longitude = 5;                   // Longitude coordinate
  double heading = 6;                     // Heading in degrees
  double speed = 7;                       // Speed in mph
  string address = 8;                     // Address name
  string formatted_location = 9;          // Formatted location string
  google.protobuf.Timestamp gps_time = 10; // GPS timestamp
  string samsara_vehicle_id = 11;         // Samsara's vehicle ID
  string vehicle_name = 12;               // Vehicle name from Samsara
}

// Batch of location updates for Kafka
message VehicleLocationUpdateBatch {
  repeated VehicleLocationUpdate updates = 1;
  google.protobuf.Timestamp batch_time = 2;
}

// VehiclePositionService provides vehicle position history (served by samsara-tracker)
service VehiclePositionService {
  // GetVehicleRoute returns GPS route points for a truck within a time range
  rpc GetVehicleRoute(GetVehicleRouteRequest) returns (GetVehicleRouteResponse);

  rpc GetVehicleRoutes(GetVehicleRoutesRequest) returns (GetVehicleRoutesResponse);

  // SaveEstimatedRoute stores estimated route polylines from HERE Maps
  rpc SaveEstimatedRoute(SaveEstimatedRouteRequest) returns (SaveEstimatedRouteResponse);

  // GetEstimatedRoute retrieves estimated route polylines for a trip
  rpc GetEstimatedRoute(GetEstimatedRouteRequest) returns (GetEstimatedRouteResponse);

  // LookupGeocodeCache returns a previously cached HERE geocoding result so the
  // caller can avoid a paid HERE API call. The result is the same JSON payload
  // the caller would have built from the live HERE response.
  rpc LookupGeocodeCache(LookupGeocodeCacheRequest) returns (LookupGeocodeCacheResponse);

  // GetCurrentDutyStatus returns each driver's latest HOS duty status from the
  // ELD feed (driving, on_duty, off_duty, sleeper_berth, yard_move,
  // personal_conveyance) and since when. Drivers with no HOS event in the last
  // 7 days are absent. Scoped by company_id from the request (DEV-2694: the
  // hourly crew message is not sent while a driver sleeps).
  rpc GetCurrentDutyStatus(GetCurrentDutyStatusRequest) returns (GetCurrentDutyStatusResponse);

  // GetLatestFuelLevels returns, per truck, the latest non-empty fuel and DEF
  // reading from the position history plus the position of the latest row.
  // A narrow answer on purpose: GetVehicleRoute fails on big windows
  // ("message larger than max"). Scoped by company_id from the request.
  rpc GetLatestFuelLevels(GetLatestFuelLevelsRequest) returns (GetLatestFuelLevelsResponse);
}

message GetLatestFuelLevelsRequest {
  string company_id = 1;
  repeated string truck_ids = 2;
}

// FuelLevelState tells a reader how far to trust a reading.
// NOT_COLLECTED: the company switched the capability off in Samsara — no numbers.
// NO_DATA: collected, but no reading in the history window — no numbers, never 0.
// STALE: older than 3 x the company's tracking interval.
enum FuelLevelState {
  FUEL_LEVEL_STATE_UNSPECIFIED = 0;
  FRESH = 1;
  STALE = 2;
  NOT_COLLECTED = 3;
  NO_DATA = 4;
}

message TruckFuelLevel {
  string truck_id = 1;
  optional double fuel_percent = 2;
  FuelLevelState fuel_state = 3;
  optional double def_percent = 4;
  FuelLevelState def_state = 5;
  // gps_time of the row the fuel reading came from (DEF may be older).
  google.protobuf.Timestamp measured_at = 6;
  // Position of the truck's latest row, so a caller needs one call for both.
  optional double latitude = 7;
  optional double longitude = 8;
  google.protobuf.Timestamp def_measured_at = 9;
}

message GetLatestFuelLevelsResponse {
  repeated TruckFuelLevel levels = 1;
}

message GetVehicleRoutesRequest {
  repeated GetVehicleRouteRequest queries = 1;
}

message GetVehicleRoutesResponse {
  repeated VehicleRoute routes = 1;
}

message VehicleRoute {
  string truck_id = 1;
  repeated RoutePoint points = 2;
  string error_message = 3;  // optional, empty on success
}

message GetVehicleRouteRequest {
  string truck_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message RoutePoint {
  double latitude = 1;
  double longitude = 2;
  double heading = 3;
  double speed = 4;
  google.protobuf.Timestamp gps_time = 5;
  string address = 6;
  double heading_degrees = 7;
  // Fuel level of the row, when the company collects it (DEV-2691).
  optional double fuel_percent = 8;
}

message GetVehicleRouteResponse {
  repeated RoutePoint points = 1;
}

// Estimated route messages

message EstimatedRouteLeg {
  // leg_index 0 is reserved for the origin segment (truck → first pending stop),
  // 1..N for stop-to-stop segments. Origin is the only leg that may be replaced
  // (truck change); 1..N are append-only.
  int32 leg_index = 1;
  string polyline = 2;           // HERE Flexible Polyline encoded string
  int32 distance_meters = 3;
  int32 duration_seconds = 4;
  string stop_id = 5;            // UUID of the destination trip stop
  string coordinates = 7;        // Decoded polyline as JSON: [[lat,lng],...]
  reserved 6;                    // formerly route_type — single source: append-once static.
  reserved "route_type";

  // Route facts for driver-preference checks (DEV-2527). Unset / empty on legs
  // built before them or when HERE returned no span data: callers must read that
  // as "not checked", never as "none".
  optional bool has_tolls = 8;       // unset when the company has toll data off
  optional bool uses_interstate = 9; // set iff the leg has facts: the "known" marker for the lists below
  repeated string states_crossed = 10;    // HERE stateCode, route order
  repeated string countries_crossed = 11; // ISO 3166-1 alpha-3, route order
  repeated string areas_crossed = 12;     // area codes (asset-tracking internal/geo)
}

message SaveEstimatedRouteRequest {
  string trip_id = 1;
  string company_id = 2;
  repeated EstimatedRouteLeg legs = 3;
  int32 total_distance_meters = 4;
  int32 total_duration_seconds = 5;
  string truck_id = 6;
}

message SaveEstimatedRouteResponse {
  bool success = 1;
}

message GetEstimatedRouteRequest {
  string trip_id = 1;
}

message GetEstimatedRouteResponse {
  string trip_id = 1;
  repeated EstimatedRouteLeg legs = 2;
  int32 total_distance_meters = 3;
  int32 total_duration_seconds = 4;
}

// Geocode cache messages — a cross-company cache of HERE geocoding results
// (geocode-by-query, lookup-by-id, geocode-by-address, reverse-geocode) so
// backend-load can serve repeat lookups from ClickHouse instead of paying HERE.

message LookupGeocodeCacheRequest {
  string kind = 1;       // geocode_query | lookup_id | geocode_address | revgeocode
  string cache_key = 2;  // normalized key (see backend-load geocodecache.normalize*)
  uint32 limit = 3;      // only meaningful for geocode_query
}

message LookupGeocodeCacheResponse {
  bool found = 1;
  string result = 2;     // JSON payload, identical shape to what HERE would yield
  uint32 item_count = 3;
}

// Active trip stops for route calculation

message GetActiveTripStopsRequest {
  string truck_id = 1;
}

message TripStopInfo {
  string stop_id = 1;
  string trip_id = 2;
  string company_id = 3;
  string stop_type = 4;       // ORIGIN, PICKUP, DROPOFF, DROPOFF_PICKUP, CARGO_TRANSFER
  int32 stop_sequence = 5;
  double latitude = 6;
  double longitude = 7;
  string status = 8;          // PENDING, ARRIVED, COMPLETED
  bool is_complete = 9;
}

message GetActiveTripStopsResponse {
  string trip_id = 1;
  string truck_id = 2;
  string company_id = 3;
  repeated TripStopInfo stops = 4;
}

// Trip stops snapshot (used by asset-tracking after consuming trips/created)

message GetTripStopsRequest {
  string trip_id = 1;
}

message GetTripStopsResponse {
  string trip_id = 1;
  string company_id = 2;
  string shipment_id = 3;
  string created_by = 4;        // creator of the parent shipment, used for route_built notification
  string truck_id = 5;          // optional, may be empty when truck not yet assigned
  repeated TripStopInfo stops = 6;
}

// Batched ETA application (replaces per-stop UpdateStopETA)

message StopETA {
  string stop_id = 1;
  google.protobuf.Timestamp planned_arrival = 2;
}

message ApplyRouteETAsRequest {
  string trip_id = 1;
  repeated StopETA etas = 2;
}

message ApplyRouteETAsResponse {
  bool success = 1;
}

// Deadhead-origin fallback (used by asset-tracking when the trip's own origin
// stop has no coordinates)

message GetDeadheadOriginRequest {
  string trip_id = 1;
}

message GetDeadheadOriginResponse {
  bool samsara_tracking_on = 1;  // company setting; when true the caller keeps live-GPS behavior
  bool has_fallback = 2;         // previous delivered trip with drop-off coordinates exists
  double lat = 3;
  double lng = 4;
}

// Odometer readings written into backend-load (DEV-2250). The company is taken
// from the asset row, not from the request: this service carries no actor.

message OdometerReadingInput {
  string asset_id = 1;                      // UUID of the truck or trailer
  VehicleType type = 2;                     // VEHICLE_TYPE_TRUCK | VEHICLE_TYPE_TRAILER
  double miles = 3;
  google.protobuf.Timestamp read_at = 4;    // when the meter was read; empty means now
  string source = 5;                        // SAMSARA | TRIP_ESTIMATE
}

message OdometerReadingResult {
  string asset_id = 1;

  enum Status {
    ACCEPTED = 0;             // stored and it is now the asset's current reading
    IGNORED_OLDER = 1;        // stored in history only: read_at is older than the current one
    REJECTED_REGRESSION = 2;  // not stored: miles below the current reading, no reason given
    NOT_FOUND = 3;            // unknown, soft-deleted, or wrong-type asset
    ERROR = 4;                // anything else; message carries the detail
  }

  Status status = 2;
  string message = 3;
  double stored_miles = 4;    // the asset's current reading after this call
}

message RecordOdometerReadingsRequest {
  repeated OdometerReadingInput readings = 1;
}

message RecordOdometerReadingsResponse {
  repeated OdometerReadingResult results = 1;  // one per request reading, in order
}

message GetCurrentDutyStatusRequest {
  string company_id = 1;
  repeated string driver_ids = 2;
}

message DriverDutyStatus {
  string driver_id = 1;
  string status = 2;
  google.protobuf.Timestamp since = 3;
}

message GetCurrentDutyStatusResponse {
  repeated DriverDutyStatus statuses = 1;
}
