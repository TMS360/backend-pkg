// pkg/proto/tasks/tasks.proto
syntax = "proto3";

package tasks;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/TMS360/backend-pkg/proto/tasks";

// TasksService is the producer API for automated task creation (DEV-1035).
// Other services (the rule engine, later the workflow engine) call CreateTask
// instead of knowing anything about the task service internals. Tenant, acting
// identity and auth travel in gRPC metadata (x-internal-token, x-company-id,
// x-actor-id) — exactly like every other internal service-to-service call,
// never in the request body.
service TasksService {
  // CreateTask creates the task for a rule-driven validation, or returns the
  // one already open for it. Idempotent on the whole DedupKey: while the
  // validation is live exactly one open task exists, so the same call twice —
  // a retry or a network duplicate — yields one task. `created` tells the
  // caller which happened.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);

  // ResolveTask auto-resolves the open task for a validation that no longer
  // holds (the problem was fixed). Idempotent: a no-op when nothing is open.
  // A later re-occurrence of the same validation creates a fresh task.
  rpc ResolveTask(ResolveTaskRequest) returns (ResolveTaskResponse);

  // ListOpenAuditChecks answers "is anything on this team-week still waiting for
  // a department's verdict?" (DEV-2448). The Audit board's finalize is one-way,
  // so it reads the checks LIVE at the moment the button is pressed rather than
  // trusting a count cached on the week.
  //
  // Read-only and idempotent. A crew with no checks, a week with none, and an
  // empty crew list all answer with an empty list — never an error.
  rpc ListOpenAuditChecks(ListOpenAuditChecksRequest) returns (ListOpenAuditChecksResponse);

  // CreateAuditCheck opens one audit check (DEV-2445): a day the dispatcher
  // closed with a status another department owns, or a day an active truck had
  // no driver. Idempotent on the claim's identity (crew+day, or truck+day for a
  // no-driver check): a producer retry returns the same card, `created` tells
  // which happened. Tenant and actor travel in metadata like CreateTask.
  rpc CreateAuditCheck(CreateAuditCheckRequest) returns (CreateAuditCheckResponse);

  // GetAuditCheckAnswer reads one check's current verdict straight from the
  // task — the dispatch service's repair path for when the answered event never
  // arrived. Read-only and idempotent; a check nobody has answered yet returns
  // answered=false, never an error.
  rpc GetAuditCheckAnswer(GetAuditCheckAnswerRequest) returns (GetAuditCheckAnswerResponse);
}

// DedupKey identifies the specific validation occurrence a task belongs to.
// The whole key together is what "the same problem" means; exactly one live
// task exists per key.
message DedupKey {
  string rule_id = 1;             // the rule that fired
  string entity_type = 2;         // load | trip | driver | document | ...
  string entity_id = 3;           // the TMS entity the task concerns (UUID)
  string validation_instance = 4; // the specific check that triggered
}

message CreateTaskRequest {
  DedupKey key = 1;

  string title = 2;
  string description = 3;
  string priority = 4;      // low|normal|high|urgent — empty = normal
  string assignee_type = 5; // user|department|role|all
  string assignee_id = 6;   // UUID; required unless assignee_type = "all"
  google.protobuf.Timestamp due_at = 7; // optional
}

message CreateTaskResponse {
  string task_id = 1;
  string status = 2; // "open" on a fresh task; current status if it already existed
  bool created = 3;  // true = new task; false = existing one returned (dup/retry)
}

message ResolveTaskRequest {
  DedupKey key = 1;
  string reason = 2; // optional; recorded on the system status change
}

message ResolveTaskResponse {
  string task_id = 1; // the resolved task, or empty when nothing was open
  bool resolved = 2;  // true = a task was auto-resolved; false = no-op
}

// ListOpenAuditChecksRequest asks about ONE team-week, named by the crew-week
// rows the caller is about to sign off. The caller owns the board, so it knows
// its crews; this service never calls the dispatch service back to find them.
message ListOpenAuditChecksRequest {
  repeated string crew_ids = 1; // UUIDs; empty = nothing to ask about
  string week_start = 2;        // YYYY-MM-DD, the naive company-local week start
}

// OpenAuditCheck is one check still waiting for an answer — exactly what a
// refusal has to name so the manager knows who to go and ask.
message OpenAuditCheck {
  string task_id = 1;
  string crew_id = 2;
  string day = 3;         // YYYY-MM-DD, the day under question
  string status_name = 4; // what the dispatcher closed the day with
  // department is the well-known key of the department that owes the answer
  // ("maintenance", "safety", …). Empty when the check was never routed to one.
  string department = 5;
  string title = 6;
}

message ListOpenAuditChecksResponse {
  repeated OpenAuditCheck checks = 1;
}

// CreateAuditCheckRequest is the whole claim in ONE call: the tasks service
// must be able to show the card, refuse a self-answer and open a rejection's
// incident without ever calling the dispatch service back. Dates are naive
// company-local YYYY-MM-DD strings, never instants (DEV-2076).
message CreateAuditCheckRequest {
  // The day under question and what it was closed with.
  string day = 1;        // YYYY-MM-DD
  string week_start = 2; // YYYY-MM-DD
  string status_name = 3;
  string explanation = 4; // optional
  string case_number = 5; // optional, e.g. "WO-1182"

  // The crew-week the day belongs to, and who set it. BOTH are empty on a
  // truck-day-with-no-driver check: no crew held the truck and nobody set a
  // status — the system noticed the gap.
  string crew_id = 6; // UUID or empty
  string set_by = 7;  // UUID or empty

  // Who answers, and who may not.
  string department = 8;             // well-known key ("maintenance", …)
  repeated string dispatcher_ids = 9; // UUIDs; nobody here may answer
  string manager_id = 10;             // UUID or empty
  string dispatch_team_id = 11;       // UUID or empty

  // What the day is about — the crew's truck, or its driver when it has none.
  string entity_type = 12; // truck | driver
  string entity_id = 13;   // UUID

  string title = 14;       // optional; empty = generated from status + day
  string description = 15; // optional
}

message CreateAuditCheckResponse {
  string task_id = 1;
  bool created = 2; // false = the same claim's check already existed (retry)
}

message GetAuditCheckAnswerRequest {
  string task_id = 1; // UUID
}

message GetAuditCheckAnswerResponse {
  // answered=false means the check is still open; every other field is then
  // zero. It is NOT an error — "no verdict yet" is the answer.
  bool answered = 1;
  string outcome = 2;     // CONFIRMED | REJECTED
  string note = 3;        // the department's words; mandatory on a reject
  string answered_by = 4; // UUID
  google.protobuf.Timestamp answered_at = 5;
}
